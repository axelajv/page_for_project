<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Kelpy Admin — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>

<div class="page">
  <div class="dash-header">
    <div class="dash-brand"><div class="dash-mark">K</div><span class="dash-title">Kelpy Admin</span></div>
    <button class="dash-logout" onclick="logout()">Déconnexion</button>
  </div>

  <div class="kpi">
    <p class="n" id="total-accounts">…</p>
    <p class="l">Comptes au total (depuis le lancement)</p>
  </div>

  <div class="panel activity-panel">
    <div class="activity-head">
      <p class="panel-title" style="margin:0;">Activité</p>
      <div class="head-controls">
        <div class="period-tabs">
          <button class="period-tab" data-period="today">Aujourd'hui</button>
          <button class="period-tab active" data-period="7d">7 jours</button>
          <button class="period-tab" data-period="30d">30 jours</button>
        </div>
        <button class="date-btn" id="date-btn">📅 Choisir une date</button>
      </div>
    </div>

    <div class="calendar" id="calendar">
      <div class="cal-head">
        <button class="cal-nav" id="cal-prev">‹</button>
        <span class="cal-month" id="cal-month"></span>
        <button class="cal-nav" id="cal-next">›</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <p class="cal-clear" id="cal-clear">Revenir aux périodes rapides</p>
    </div>

    <div class="activity-stats">
      <div class="activity-stat">
        <p class="l"><span class="n" id="signups-n">…</span>&nbsp; Inscriptions</p>
        <div class="mini-bars" id="signups-bars"></div>
      </div>
      <div class="activity-stat">
        <p class="l"><span class="n" id="checks-n">…</span>&nbsp; Checks postés</p>
        <div class="mini-bars" id="checks-bars"></div>
      </div>
      <div class="activity-stat">
        <p class="l"><span class="n" id="sessions-n">…</span>&nbsp; Sessions postées</p>
        <div class="mini-bars" id="sessions-bars"></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <p class="panel-title">Répartition des niveaux</p>
    <div class="donut-wrap">
      <svg width="120" height="120" viewBox="0 0 42 42" id="donut"></svg>
      <div class="legend" id="donut-legend"></div>
    </div>
  </div>

  <div class="alert-row">
    <a class="alert-card" id="spots-alert" href="spots.html">
      <span class="alert-ic">📍</span>
      <div><p class="alert-t" id="spots-alert-title">…</p><p class="alert-d">Détecté par la vérification planifiée</p></div>
      <span class="alert-chev">→</span>
    </a>
    <div class="alert-card" id="moderation-alert">
      <span class="alert-ic">🛡️</span>
      <div><p class="alert-t" id="moderation-alert-title">…</p><p class="alert-d">Checks, comptes, descriptions — à gérer depuis l'app</p></div>
    </div>
  </div>
</div>

<script src="shared.js?v=2"></script>
<script src="dashboard.js?v=2"></script>

</body>
</html>
