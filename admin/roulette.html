<body>

<div class="page">
  <div class="dash-header">
    <a class="back-link" href="dashboard.html">← Retour au dashboard</a>
    <button class="dash-logout" onclick="logout()">Déconnexion</button>
  </div>

  <div class="panel">
    <p class="panel-title">Tirage au sort</p>

    <textarea id="names-input" class="roulette-textarea" placeholder="Un pseudo par ligne...
@offieb
@axelajv
..."></textarea>

    <div class="roulette-controls">
      <button class="btn btn-primary" id="load-btn">Charger la liste</button>
      <button class="btn btn-danger" id="clear-btn">Réinitialiser</button>
    </div>
    <p class="participant-count" id="participant-count">0 participant</p>

    <div class="wheel-wrap">
      <div class="wheel-pointer"></div>
      <div class="wheel" id="wheel"></div>
      <div class="wheel-hub">🐚</div>
    </div>

    <div class="roulette-controls">
      <button class="btn btn-primary" id="spin-btn" disabled>🎲 Lancer le tirage</button>
    </div>

    <div class="winner-card" id="winner-card">
      <p class="winner-eyebrow">Gagnant 🎉</p>
      <p class="winner-name" id="winner-name"></p>
      <div class="winner-actions">
        <button class="btn btn-primary" id="respin-btn">Refaire un tirage</button>
        <button class="btn btn-danger" id="remove-winner-btn">Retirer de la liste</button>
      </div>
    </div>
  </div>

  <div class="panel" id="history-panel" style="display:none;">
    <p class="panel-title">Historique de la session</p>
    <div id="history-list"></div>
  </div>
</div>

<script src="shared.js?v=3"></script>
<script src="roulette.js?v=5"></script>

</body>
