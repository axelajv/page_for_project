<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Kelpy Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-mark">K</div>
    <p class="login-title">Kelpy Admin</p>
    <p class="login-sub">Réservé au fondateur</p>

    <form id="login-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn" id="login-btn">Se connecter</button>
      <p class="login-error" id="login-error"></p>
    </form>
  </div>
</div>

<script src="shared.js?v=2"></script>
<script>
  (async function checkExistingSession() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session && session.user.email === ADMIN_EMAIL) {
      window.location.href = 'dashboard.html';
    }
  })();

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const errorEl = document.getElementById('login-error');
    errorEl.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Connexion…';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      errorEl.textContent = `Erreur : ${error.message} (${error.status ?? '?'})`;
      btn.disabled = false;
      btn.textContent = 'Se connecter';
      return;
    }
    if (data.session.user.email !== ADMIN_EMAIL) {
      await supabaseClient.auth.signOut();
      errorEl.textContent = 'Ce compte n’a pas accès à cet espace.';
      btn.disabled = false;
      btn.textContent = 'Se connecter';
      return;
    }
    window.location.href = 'dashboard.html';
  });
</script>

</body>
</html>
